name: Publish to npm

on:
  release:
    types: [published]
  # manual re-run after fixing npm auth, without cutting a new release
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org

      - run: npm ci

      - run: npm run typecheck

      - run: npm run build

      - run: npm test

      # Upgrade npm only for the publish step: `npm stage` needs npm >= 11.15.0
      # (and Node >= 22.14) while Node 22 ships npm 10. Pinned to 11 because
      # npm 12 blocks dependency install scripts by default, which leaves
      # better-sqlite3 without its native binding if it runs before `npm ci`.
      - run: npm install -g npm@^11.15.0

      # Staged publishing: NPM_TOKEN is a stage-only granular token, so CI can
      # only submit the version. It goes live after a maintainer approves it
      # with 2FA (npmjs.com → Staged Packages, or `npm stage approve <id>`).
      - run: npm stage publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
