name: Publish to npm

on:
  release:
    types: [published]
  # manual re-run after fixing npm auth, without cutting a new release
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org

      # npm trusted publishing (OIDC, no long-lived token) needs npm >= 11.5.1;
      # Node 22 ships npm 10. NODE_AUTH_TOKEN below stays as a fallback.
      - run: npm install -g npm@latest

      - run: npm ci

      - run: npm run typecheck

      - run: npm run build

      - run: npm test

      - run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
